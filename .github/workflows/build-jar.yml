
name: Build Banking Spark Scala JAR

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Compile Scala project
        run: sbt clean compile

      - name: Create JAR
        run: sbt package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: banking-spark-scala-jar
          path: target/scala-2.13/*.jar
